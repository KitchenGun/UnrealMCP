[project]
name = "unreal-mcp"
version = "0.1.0"
description = "Unreal Engine 5 MCP 서버 -- 자연어로 UE5 에디터 제어"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "anyio>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unreal_mcp"]

[project.scripts]
unreal-mcp = "unreal_mcp.main:main"
